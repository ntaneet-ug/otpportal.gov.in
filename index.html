<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Score Card Verification</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --success-color: #16a34a;
      --error-color: #dc2626;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Form Section Layout */
    .verification-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      text-align: center;
    }

    .card h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    .card p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #475569;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    input[type="tel"],
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary-color);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
      width: auto;
      white-space: nowrap;
      padding: 12px 16px;
    }

    .btn-secondary:hover {
      background-color: #cbd5e1;
    }

    .status-msg {
      margin-top: 14px;
      font-size: 0.875rem;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .status-msg.error {
      display: block;
      background-color: #fef2f2;
      color: var(--error-color);
      border: 1px solid #fecaca;
    }

    .status-msg.info {
      display: block;
      background-color: #eff6ff;
      color: var(--primary-color);
      border: 1px solid #bfdbfe;
    }

    /* Score Card Viewing Area */
    .scorecard-view {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    .success-banner {
      background-color: #dcfce7;
      color: #14532d;
      border-bottom: 1px solid #bbf7d0;
      padding: 14px 20px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .iframe-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 50px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- STEP 1: VERIFICATION FORM -->
  <div class="verification-wrapper" id="authStep">
    <div class="card">
      <h2>Score Card Access</h2>
      <p class="subtitle">Enter your registered mobile number to proceed.</p>

      <form id="otpForm" onsubmit="event.preventDefault(); verifyOTP();">
        <div class="form-group">
          <label for="mobileNumber">Registered Mobile Number</label>
          <div class="input-row">
            <input 
              type="tel" 
              id="mobileNumber" 
              value="+91 7439108810" 
              placeholder="+91 XXXXXXXXXX" 
              required
            >
            <button type="button" class="btn btn-secondary" onclick="sendOTP()">Send OTP</button>
          </div>
        </div>

        <div class="form-group" id="otpGroup" style="display: none;">
          <label for="otpInput">Enter 6-Digit OTP</label>
          <input 
            type="text" 
            id="otpInput" 
            placeholder="e.g. 123456" 
            maxlength="6"
          >
        </div>

        <button type="submit" class="btn" id="verifyBtn" style="display: none;">Verify & View Score Card</button>
        <div id="statusMessage" class="status-msg"></div>
      </form>
    </div>
  </div>

  <!-- STEP 2: SCORE CARD VIEWER (Embedded directly on same page) -->
  <div class="scorecard-view" id="scorecardStep">
    <div class="success-banner">
      Registered mobile number verified successfully! Proceeding to view the score card...
    </div>
    <div class="iframe-container">
      <iframe 
        id="scoreCardFrame"
        src="" 
        allowfullscreen="true" 
        webkitallowfullscreen="true" 
        mozallowfullscreen="true">
      </iframe>
    </div>
  </div>

  <script>
    const REGISTERED_NUMBER = "7439108810";
    const FLIPHTML5_LINK = "https://ntaneet-ug.github.io/Maintance/";
    let currentGeneratedOTP = null;

    // Helper function to clean phone number inputs
    function cleanPhoneNumber(phone) {
      return phone.replace(/\D/g, '').slice(-10);
    }

    function sendOTP() {
      const inputPhone = document.getElementById('mobileNumber').value;
      const statusDiv = document.getElementById('statusMessage');
      const cleanedInput = cleanPhoneNumber(inputPhone);

      if (cleanedInput !== REGISTERED_NUMBER) {
        statusDiv.className = "status-msg error";
        statusDiv.innerText = "Error: Mobile number is not registered.";
        return;
      }

      // Generate a random 6-digit OTP for testing
      currentGeneratedOTP = Math.floor(100000 + Math.random() * 900000).toString();

      // Show OTP input fields
      document.getElementById('otpGroup').style.display = 'block';
      document.getElementById('verifyBtn').style.display = 'block';

      statusDiv.className = "status-msg info";
      statusDiv.innerText = `OTP sent to ${inputPhone}. (Test OTP: ${currentGeneratedOTP})`;
    }

    function verifyOTP() {
      const userOTP = document.getElementById('otpInput').value.trim();
      const statusDiv = document.getElementById('statusMessage');

      if (!currentGeneratedOTP) {
        statusDiv.className = "status-msg error";
        statusDiv.innerText = "Please click 'Send OTP' first.";
        return;
      }

      if (userOTP === currentGeneratedOTP) {
        // Hide authentication section
        document.getElementById('authStep').style.display = 'none';

        // Load iframe link and reveal scorecard view on same page
        const iframe = document.getElementById('scoreCardFrame');
        iframe.src = FLIPHTML5_LINK;
        document.getElementById('scorecardStep').style.display = 'flex';
      } else {
        statusDiv.className = "status-msg error";
        statusDiv.innerText = "Invalid OTP. Please try again.";
      }
    }
  </script>
</body>
</html>
