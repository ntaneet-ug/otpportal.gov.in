<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTA NEET (UG) 2026 Score Card Viewing Verification Portal</title>
  <style>
    :root {
      --primary-color: #1e3c72;
      --primary-dark: #142850;
      --accent-color: #00c6ff;
      --success-color: #2e7d32;
      --error-color: #c62828;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 450px;
      padding: 30px;
      text-align: center;
    }

    h1 {
      color: var(--primary-color);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 25px;
      line-height: 1.4;
      border-bottom: 2px solid #eef2f5;
      padding-bottom: 15px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      border: 2px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary-color);
    }

    .country-code {
      background: #f0f0f0;
      padding: 12px;
      font-size: 0.95rem;
      color: #333;
      font-weight: 600;
      border-right: 1px solid #ddd;
    }

    input[type="tel"] {
      width: 100%;
      padding: 12px;
      border: none;
      outline: none;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    button.btn {
      width: 100%;
      padding: 12px;
      background: var(--primary-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    button.btn:hover {
      background: var(--primary-dark);
    }

    .message {
      margin-top: 15px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .message.success {
      display: block;
      background-color: #e8f5e9;
      color: var(--success-color);
      border: 1px solid #a5d6a7;
    }

    .message.error {
      display: block;
      background-color: #ffebee;
      color: var(--error-color);
      border: 1px solid #ef9a9a;
    }

    /* Section Step 2: Slide Captcha Styling */
    #captchaSection {
      display: none;
      margin-top: 25px;
      border-top: 2px dashed #ddd;
      padding-top: 20px;
    }

    .captcha-title {
      font-size: 1rem;
      color: #333;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .canvas-container {
      position: relative;
      width: 300px;
      height: 150px;
      margin: 0 auto 15px auto;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    #bgCanvas {
      width: 300px;
      height: 150px;
      display: block;
    }

    #pieceCanvas {
      position: absolute;
      top: 40px;
      left: 0;
      z-index: 10;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.5);
      border: 1px solid #fff;
    }

    .slider-container {
      width: 300px;
      margin: 0 auto;
    }

    input[type="range"] {
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: #ddd;
      outline: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>NTA NEET (UG) 2026 Score Card Viewing Verification Portal</h1>

    <!-- Mobile Number Verification Form -->
    <div id="mobileSection">
      <div class="form-group">
        <label for="mobileInput">Enter Registered Mobile Number:</label>
        <div class="input-wrapper">
          <span class="country-code">+91</span>
          <input type="tel" id="mobileInput" placeholder="10-digit mobile number" maxlength="10">
        </div>
      </div>
      <button class="btn" onclick="verifyMobile()">Verify Mobile Number</button>
    </div>

    <!-- Status Output Message -->
    <div id="outputMessage" class="message"></div>

    <!-- Realtime Slide Puzzle Captcha Section -->
    <div id="captchaSection">
      <div class="captcha-title">Slide the puzzle piece to complete the verification and proceed to view the Official Score Card</div>
      <div class="canvas-container">
        <canvas id="bgCanvas" width="300" height="150"></canvas>
        <canvas id="pieceCanvas" width="40" height="40"></canvas>
      </div>
      <div class="slider-container">
        <input type="range" id="slider" min="0" max="260" value="0" oninput="movePiece(this.value)" onchange="verifyCaptcha(this.value)">
      </div>
    </div>
  </div>

  <script>
    const VALID_NUMBER = "7439108810";
    const TARGET_X = 190; // Target X coordinate for puzzle cutout
    const TARGET_Y = 40;  // Target Y coordinate for puzzle cutout
    const PIECE_SIZE = 40; // Puzzle piece size in px

    function verifyMobile() {
      const mobileInput = document.getElementById('mobileInput').value.trim();
      const messageDiv = document.getElementById('outputMessage');
      const captchaSection = document.getElementById('captchaSection');

      if (mobileInput === VALID_NUMBER) {
        // Success match
        messageDiv.className = "message success";
        messageDiv.innerText = "Registered Mobile Number Successfully found in Official NTA Records";
        
        // Hide form inputs and reveal slide captcha
        document.getElementById('mobileSection').style.display = 'none';
        captchaSection.style.display = 'block';
        
        // Initialize captcha artwork
        initCaptcha();
      } else {
        // Non-match
        messageDiv.className = "message error";
        messageDiv.innerText = "mobile number not found in official NTA records try again";
        captchaSection.style.display = 'none';
      }
    }

    // Initialize Puzzle Canvas Procedurally
    function initCaptcha() {
      const bgCanvas = document.getElementById('bgCanvas');
      const pieceCanvas = document.getElementById('pieceCanvas');
      const bgCtx = bgCanvas.getContext('2d');
      const pieceCtx = pieceCanvas.getContext('2d');

      // 1. Draw a decorative background scene
      let gradient = bgCtx.createLinearGradient(0, 0, 300, 150);
      gradient.addColorStop(0, '#1e3c72');
      gradient.addColorStop(0.5, '#2a5298');
      gradient.addColorStop(1, '#00c6ff');
      bgCtx.fillStyle = gradient;
      bgCtx.fillRect(0, 0, 300, 150);

      // Add visual shapes to make the puzzle alignment identifiable
      bgCtx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      bgCtx.beginPath();
      bgCtx.arc(80, 50, 40, 0, Math.PI * 2);
      bgCtx.fill();

      bgCtx.fillStyle = 'rgba(255, 255, 255, 0.15)';
      bgCtx.beginPath();
      bgCtx.arc(220, 100, 60, 0, Math.PI * 2);
      bgCtx.fill();

      bgCtx.fillStyle = '#ffffff';
      bgCtx.font = 'bold 16px Segoe UI';
      bgCtx.fillText('SCORE CARD PORTAL', 60, 80);

      // 2. Extract image data for puzzle piece from target position
      const pieceData = bgCtx.getImageData(TARGET_X, TARGET_Y, PIECE_SIZE, PIECE_SIZE);
      pieceCtx.putImageData(pieceData, 0, 0);

      // 3. Draw cutout hole overlay on background canvas
      bgCtx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      bgCtx.fillRect(TARGET_X, TARGET_Y, PIECE_SIZE, PIECE_SIZE);
      bgCtx.strokeStyle = '#ffffff';
      bgCtx.lineWidth = 2;
      bgCtx.strokeRect(TARGET_X, TARGET_Y, PIECE_SIZE, PIECE_SIZE);

      // Reset slider & piece position
      document.getElementById('slider').value = 0;
      pieceCanvas.style.left = '0px';
    }

    // Move piece in real-time as slider shifts
    function movePiece(val) {
      const pieceCanvas = document.getElementById('pieceCanvas');
      pieceCanvas.style.left = val + 'px';
    }

    // Verify Puzzle Placement when slider released
    function verifyCaptcha(val) {
      const messageDiv = document.getElementById('outputMessage');
      const difference = Math.abs(val - TARGET_X);

      // Allow 4px tolerance
      if (difference <= 4) {
        messageDiv.className = "message success";
        messageDiv.innerText = "Captcha Verified Successfully! Redirecting...";
        
        // Disable slider input on success
        document.getElementById('slider').disabled = true;

        // Redirect after short delay
        setTimeout(() => {
          window.location.href = "https://ntaneet-ug.github.io/Maintance/";
        }, 1200);
      } else {
        messageDiv.className = "message error";
        messageDiv.innerText = "Captcha alignment failed. Please try again!";
        
        // Reset position on failure
        setTimeout(() => {
          document.getElementById('slider').value = 0;
          movePiece(0);
        }, 800);
      }
    }
  </script>
</body>
</html>
